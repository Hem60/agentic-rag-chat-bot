# ==============================================================================
# docker-compose.yml -- local run of the image
#
#   docker compose up --build        build (models + index baked in) and start
#   docker compose down
#
# The image already contains the models and the FAISS/BM25 index, so there are no
# volumes: mounting ./vectorstore here would hide the baked-in index. To change the
# PDFs, edit data/pdfs and rebuild.
# ==============================================================================

services:
  rag-qa:
    build: .
    container_name: rag-qa
    env_file:
      - .env            # HUGGINGFACEHUB_API_TOKEN, GENERATION_MODEL, JUDGE_MODEL, ...
    ports:
      - "8000:8000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
